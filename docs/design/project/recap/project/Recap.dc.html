<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лист «Занятие сохранено»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#131318;font-family:Manrope,sans-serif;color:#E6E4EE}
.grow{animation:grow 600ms cubic-bezier(.2,.8,.2,1) 200ms both;transform-origin:left center}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</helmet>
<div role="dialog" aria-label="{{aria}}" style="width: 412px; height: {{h}}px; box-sizing: border-box; background: #292833; border-radius: 28px 28px 0 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 16px; font-family: Manrope, sans-serif; color: #E6E4EE;">
<div style="width: 32px; height: 4px; border-radius: 2px; background: #6B6880; align-self: center; flex-shrink: 0;"></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px;">
<div style="font-size: 14px; font-weight: 600; color: #A39FB5;">Занятие сохранено</div>
<div style="font-size: 40px; line-height: 48px; font-weight: 800; font-feature-settings: 'tnum';">{{duration}}</div>
<sc-if value="{{hasDay}}" hint-placeholder-val="{{true}}">
<div style="font-size: 14px; color: #A39FB5; font-feature-settings: 'tnum';">{{day}}</div>
</sc-if>
</div>
<div style="background: #1E1D25; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; align-items: center; gap: 10px; height: 44px;">
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="7" cy="17.5" rx="4" ry="3" fill="#C4ADFF" transform="rotate(-20 7 17.5)"></ellipse><path d="M10.6 16.5V8.5c0-3.2 1.8-4.8 5-4.8h5" fill="none" stroke="#C4ADFF" stroke-width="2" stroke-linecap="round"></path><path d="M20.6 3.7h0" stroke="#C4ADFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3"></path></svg>
<div style="font-size: 32px; font-weight: 800; color: #C4ADFF; font-feature-settings: 'tnum';">{{takts}}</div>
<div style="font-size: 17px; font-weight: 600; color: #C4ADFF; padding-top: 6px;">{{taktsWord}}</div>
</div>
<div style="height: 1px; background: #3A3846; margin: 6px 0;"></div>
<sc-for list="{{sources}}" as="s" hint-placeholder-count="3">
<div style="display: flex; align-items: center; height: 34px; gap: 8px;">
<div style="font-size: 15px; font-weight: 600;">{{s.label}}</div>
<div style="font-size: 15px; color: #A39FB5; font-feature-settings: 'tnum';">· {{s.count}}</div>
<div style="flex-grow: 1;"></div>
<div style="font-size: 15px; font-weight: 700; font-feature-settings: 'tnum';">{{s.takts}}</div>
</div>
</sc-for>
</div>
<div style="background: #1E1D25; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
<sc-if value="{{road.bar}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 8px;">
<div style="font-size: 15px; font-weight: 700; color: {{road.color}}; flex-grow: 1;">{{road.title}}</div>
<sc-if value="{{road.go}}" hint-placeholder-val="{{false}}">
<a href="#" style="height: 40px; padding: 0 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; color: #C4ADFF; font-size: 14px; font-weight: 700; text-decoration: none;"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="3" fill="none" stroke="#C4ADFF" stroke-width="2"></rect><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M10 14h6M13 11l3 3-3 3" fill="none" stroke="#C4ADFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>В дорогу</a>
</sc-if>
</div>
<div style="height: 8px; border-radius: 4px; background: #292833; position: relative; overflow: hidden;">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{road.after}}%; background: #C4ADFF; border-radius: 4px;" class="grow"></div>
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{road.before}}%; background: #5B43B8; border-radius: 4px;"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #A39FB5; font-feature-settings: 'tnum';"><div>{{road.leg}}</div><div>{{road.count}}</div></div>
</sc-if>
<sc-if value="{{road.plain}}" hint-placeholder-val="{{false}}">
<div style="font-size: 15px; font-weight: 600; color: #A39FB5; line-height: 21px;">{{road.title}}</div>
</sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<div style="background: #1E1D25; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-height: 104px; box-sizing: border-box;">
<div style="display: flex; align-items: center; gap: 8px;">
<svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><path d="M11 1.5c1.2 4.2 6.8 7 6.8 13.1A6.8 6.8 0 0 1 4.2 14.6c0-3 1.6-4.9 3.1-6.4.4 2 1.4 3.2 2.6 3.7C9.6 8.1 9.9 4.4 11 1.5z" fill="#F28C3B"></path><path d="M11 12c.8 2 3.4 3.3 3.4 6.1a3.4 3.4 0 0 1-6.8 0c0-1.6.9-2.6 1.7-3.3.2 1 .8 1.6 1.3 1.8-.2-1.8 0-3.3.4-4.6z" fill="#FFE29A"></path></svg>
<div style="font-size: 28px; font-weight: 800; font-feature-settings: 'tnum';">{{streak}}</div>
</div>
<div style="font-size: 14px; color: #A39FB5;">{{streakWord}}</div>
<sc-if value="{{streakUp}}" hint-placeholder-val="{{true}}">
<div style="font-size: 13px; font-weight: 700; color: #F28C3B;">+1 день</div>
</sc-if>
</div>
<div style="background: #1E1D25; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-height: 104px; box-sizing: border-box;">
<sc-if value="{{levelUp}}" hint-placeholder-val="{{false}}">
<div style="font-size: 12px; font-weight: 700; color: #C4ADFF;">Новый уровень</div>
</sc-if>
<div style="font-size: 16px; font-weight: 700; line-height: 20px;">{{level}}</div>
<div style="height: 6px; border-radius: 3px; background: #292833; position: relative; overflow: hidden; margin-top: 4px;">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{levelAfter}}%; background: #C4ADFF; border-radius: 3px;" class="grow"></div>
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{levelBefore}}%; background: #5B43B8; border-radius: 3px;"></div>
</div>
<div style="font-size: 12px; color: #A39FB5; font-feature-settings: 'tnum';">{{levelLeft}}</div>
</div>
</div>
<div style="flex-grow: 1;"></div>
<button type="button" style="height: 56px; border: none; border-radius: 28px; background: #C4ADFF; color: #2E1A6E; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 700; flex-shrink: 0;">Готово</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["normal","enough","bare","done"],"default":"normal"},"h":{"editor":null},"$preview":{"width":412,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'normal';
    const h = Number(this.props.h ?? 700);
    const V = {
      normal: {
        duration: '47 мин', hasDay: true, day: 'сегодня всего 1 ч 25 мин',
        takts: '+225', taktsWord: 'тактов',
        sources: [
          { label: 'Ноты в строе', count: '212', takts: '+71' },
          { label: 'Время', count: '47 мин', takts: '+94' },
          { label: 'Репертуар', count: '2', takts: '+60' },
        ],
        road: { bar: true, plain: false, go: false, color: '#E6E4EE', title: 'до Праги — ещё 903', before: 29.5, after: 43.6, leg: 'Вена → Прага', count: '697 / 1 600' },
        streak: '6', streakWord: 'дней подряд', streakUp: true,
        levelUp: false, level: 'Уровень 7 · Вибрато', levelBefore: 53.6, levelAfter: 54.4, levelLeft: 'до 8-го — 45 ч 50 мин',
        aria: 'Занятие сохранено, 47 минут. Плюс 225 тактов: ноты в строе — 71, время — 94, репертуар — 60. До Праги ещё 903. 6 дней подряд. Уровень 7, до восьмого 45 часов 50 минут.',
      },
      enough: {
        duration: '1 ч 10 мин', hasDay: false, day: '',
        takts: '+305', taktsWord: 'тактов',
        sources: [
          { label: 'Ноты в строе', count: '404', takts: '+135' },
          { label: 'Время', count: '1 ч 10 мин', takts: '+140' },
          { label: 'Репертуар', count: '1', takts: '+30' },
        ],
        road: { bar: true, plain: false, go: true, color: '#C4ADFF', title: 'Хватает до Праги', before: 84, after: 100, leg: 'Вена → Прага', count: '1 650 / 1 600' },
        streak: '12', streakWord: 'дней подряд', streakUp: false,
        levelUp: true, level: '8 · Третья позиция', levelBefore: 0, levelAfter: 0.6, levelLeft: 'до 9-го — 149 ч 10 мин',
        aria: 'Занятие сохранено, 1 час 10 минут. Плюс 305 тактов. Хватает до Праги. 12 дней подряд. Новый уровень — 8, Третья позиция.',
      },
      bare: {
        duration: '12 мин', hasDay: false, day: '',
        takts: '+24', taktsWord: 'такта',
        sources: [
          { label: 'Время', count: '12 мин', takts: '+24' },
        ],
        road: { bar: false, plain: true, go: false, color: '#A39FB5', title: 'Такты копятся — дорога начнётся из дома', before: 0, after: 0, leg: '', count: '' },
        streak: '1', streakWord: 'день подряд', streakUp: true,
        levelUp: false, level: 'Уровень 1 · Первый звук', levelBefore: 0, levelAfter: 10, levelLeft: 'до 2-го — 1 ч 48 мин',
        aria: 'Занятие сохранено, 12 минут. Плюс 24 такта: время — 24. Такты копятся — дорога начнётся из дома. 1 день подряд. Уровень 1, до второго 1 час 48 минут.',
      },
      done: {
        duration: '52 мин', hasDay: false, day: '',
        takts: '+176', taktsWord: 'тактов',
        sources: [
          { label: 'Ноты в строе', count: '216', takts: '+72' },
          { label: 'Время', count: '52 мин', takts: '+104' },
        ],
        road: { bar: false, plain: true, go: false, color: '#A39FB5', title: 'Маршрут пройден · в кошельке 2 516', before: 0, after: 0, leg: '', count: '' },
        streak: '31', streakWord: 'день подряд', streakUp: true,
        levelUp: false, level: 'Уровень 10 · Концертмейстер', levelBefore: 12.1, levelAfter: 12.5, levelLeft: 'до 11-го — 218 ч 45 мин',
        aria: 'Занятие сохранено, 52 минуты. Плюс 176 тактов: ноты в строе — 72, время — 104. Маршрут пройден, в кошельке 2516. 31 день подряд. Уровень 10.',
      },
    };
    return Object.assign({ h }, V[v] ?? V.normal);
  }
}
</script>
</body>
</html>
