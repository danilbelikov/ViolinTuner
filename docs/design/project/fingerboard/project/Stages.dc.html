<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ступени клетки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0;background:#131318;font-family:Manrope,sans-serif;color:#E6E4EE}</style>
</helmet>
<div style="width: 820px; height: 420px; box-sizing: border-box; padding: 32px; background: #131318; font-family: Manrope, sans-serif; color: #E6E4EE; display: flex; flex-direction: column; gap: 28px;">
<div style="font-size: 22px; font-weight: 700;">Пять ступеней — формой, не только цветом</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px;">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
<div style="width: 120px; height: 120px; border-radius: 20px; background: #0C0B10; display: flex; align-items: center; justify-content: center;">
<svg width="100" height="100" viewBox="0 0 100 100" aria-hidden="true">
<line x1="50" y1="0" x2="50" y2="100" stroke="#8D8A96" stroke-opacity="0.75" stroke-width="2.4"></line>
<sc-if value="{{s.ring}}" hint-placeholder-val="{{false}}">
<circle cx="50" cy="50" r="46" fill="none" stroke="#C9A24A" stroke-width="4.5"></circle>
</sc-if>
<circle cx="50" cy="50" r="37" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-opacity="{{s.so}}" stroke-width="{{s.sw}}" stroke-dasharray="{{s.dash}}"></circle>
<sc-if value="{{s.label}}" hint-placeholder-val="{{true}}">
<text x="50" y="50" text-anchor="middle" dominant-baseline="central" fill="{{s.lc}}" font-size="27" font-weight="700" font-family="Manrope, sans-serif">A<tspan font-size="18" font-weight="600" dy="6">5</tspan></text>
</sc-if>
</svg>
</div>
<div style="font-size: 16px; font-weight: 700;">{{s.name}}</div>
<div style="font-size: 13px; line-height: 18px; color: #A39FB5;">{{s.rule}}</div>
</div>
</sc-for>
</div>
<div style="font-size: 13px; line-height: 19px; color: #A39FB5;">Цветов зон нет: зелёный, янтарный и красный живут только на Live. Фиолетовый — цвет времени (как календарь), латунь — цвет подходов (закладка на Live). Ступень не отнимается.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      stages: [
        { name: 'туман', rule: 'ещё не звучала', fill: '#15141B', stroke: '#A39FB5', so: 0.45, sw: 2.6, dash: '7 7', label: false, lc: '#A39FB5', ring: false },
        { name: 'звучала', rule: 'сыграна хоть раз', fill: '#1E1D25', stroke: '#A39FB5', so: 1, sw: 3, dash: '', label: true, lc: '#A39FB5', ring: false },
        { name: 'в строе', rule: '10 раз в строе за всё время', fill: '#5B43B8', stroke: '#5B43B8', so: 1, sw: 0, dash: '', label: true, lc: '#E9DDFF', ring: false },
        { name: 'чистая', rule: 'за день 20 раз, из них 16 в строе', fill: '#C9A24A', stroke: '#C9A24A', so: 1, sw: 0, dash: '', label: true, lc: '#2A2430', ring: false },
        { name: 'своя', rule: 'пять чистых дней', fill: '#C9A24A', stroke: '#C9A24A', so: 1, sw: 0, dash: '', label: true, lc: '#2A2430', ring: true },
      ],
    };
  }
}
</script>
</body>
</html>
