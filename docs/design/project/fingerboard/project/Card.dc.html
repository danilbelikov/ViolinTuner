<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка «Гриф»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0;background:#131318;font-family:Manrope,sans-serif;color:#E6E4EE}</style>
</helmet>
<a href="Grif.dc.html" aria-label="{{aria}}" style="width: 380px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 12px; background: #1E1D25; border-radius: 16px; text-decoration: none; color: #E6E4EE; font-family: Manrope, sans-serif;">
<svg width="110" height="44" viewBox="0 0 110 44" aria-hidden="true" style="flex-shrink: 0;">
<rect x="0" y="2" width="110" height="40" rx="6" fill="#0C0B10"></rect>
<rect x="5" y="4" width="2.5" height="36" rx="1" fill="#E6DFCC" fill-opacity="0.8"></rect>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
<line x1="6" y1="{{l.y}}" x2="108" y2="{{l.y}}" stroke="#8D8A96" stroke-opacity="0.5" stroke-width="{{l.w}}"></line>
</sc-for>
<sc-for list="{{dots}}" as="d" hint-placeholder-count="46">
<circle cx="{{d.x}}" cy="{{d.y}}" r="{{d.r}}" fill="{{d.fill}}" stroke="{{d.stroke}}" stroke-opacity="{{d.so}}" stroke-width="{{d.sw}}"></circle>
</sc-for>
</svg>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
<div style="font-size: 16px; font-weight: 700; line-height: 22px;">Гриф</div>
<div style="font-size: 13px; font-weight: 500; line-height: 18px; color: #A39FB5; font-feature-settings: 'tnum'; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{line}}</div>
</div>
<sc-if value="{{hasNew}}" hint-placeholder-val="{{false}}">
<div style="flex-shrink: 0; height: 24px; padding: 0 10px; border-radius: 12px; background: #C4ADFF; color: #2E1A6E; font-size: 12px; font-weight: 700; display: flex; align-items: center; font-feature-settings: 'tnum';">новое · 3</div>
</sc-if>
<sc-if value="{{noNew}}" hint-placeholder-val="{{true}}">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6" fill="none" stroke="#A39FB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</sc-if>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["normal","new","empty"],"default":"new"},"$preview":{"width":380,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant ?? 'new';
    const empty = variant === 'empty';
    const OPEN = [55, 62, 69, 76];
    const YS = [37, 27, 17, 7]; // lying down: E on top
    const r = Math.pow(36 / 56, 1 / 23);
    const along = (n) => { let d = 0, s = 56; for (let k = 0; k < n; k++) { d += s; s *= r; } return d; };
    const stringOf = (m) => (m <= 61 ? 0 : m <= 68 ? 1 : m <= 75 ? 2 : 3);
    const FILLED = {
      55: 4, 56: 1, 57: 3, 58: 2, 59: 3, 60: 2, 61: 1,
      62: 4, 63: 2, 64: 3, 65: 2, 66: 3, 67: 3, 68: 1,
      69: 4, 70: 2, 71: 3, 72: 3, 73: 2, 74: 3, 75: 1,
      76: 4, 77: 3, 78: 2, 79: 3, 80: 1, 81: 3, 82: 1, 83: 2, 84: 2, 85: 1, 86: 1, 88: 1,
    };
    const STYLE = [
      { r: 1.6, fill: 'none', stroke: '#A39FB5', so: 0.35, sw: 0.8 },
      { r: 1.8, fill: '#1E1D25', stroke: '#A39FB5', so: 0.9, sw: 1 },
      { r: 2.1, fill: '#7A62D8', stroke: '#7A62D8', so: 1, sw: 0 },
      { r: 2.3, fill: '#C9A24A', stroke: '#C9A24A', so: 1, sw: 0 },
      { r: 2.7, fill: '#C9A24A', stroke: '#F1DFA8', so: 1, sw: 0.7 },
    ];
    const dots = [];
    for (let m = 55; m <= 100; m++) {
      const si = stringOf(m);
      const n = m - OPEN[si];
      const stage = empty ? 0 : (FILLED[m] ?? 0);
      dots.push(Object.assign({}, STYLE[stage], { x: (10 + along(n) * 96 / 1087).toFixed(1), y: YS[si] }));
    }
    const lines = YS.map((y, i) => ({ y, w: [1.2, 1, 0.8, 0.6][i] }));
    const line = empty ? 'ноты проступят с занятиями' : '33 из 46 · 15 чистых';
    const hasNew = variant === 'new';
    const aria = empty ? 'Гриф: ноты проступят с занятиями' : `Гриф: на грифе 33 из 46, чистых 15${hasNew ? ', новое 3' : ''}`;
    return { dots, lines, line, hasNew, noNew: !hasNew, aria };
  }
}
</script>
</body>
</html>
